[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# --- INTERIM: not yet ported to React ---------------------------------
# The team space and CRM are still being rebuilt. Until their React ports
# land, serve the previous working pages so the team's tools keep running.
# Delete these two rules (and public/legacy/) once Team.jsx and Crm.jsx
# are finished, so the routes fall through to the React app below.
[[redirects]]
  from = "/team"
  to = "/legacy/team.html"
  status = 200

[[redirects]]
  from = "/sales-intelligence"
  to = "/legacy/sales-intelligence.html"
  status = 200
# ----------------------------------------------------------------------

# SPA fallback — every other route is served by the React app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets are immutable; everything else revalidates so a
# redeploy is picked up immediately.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
