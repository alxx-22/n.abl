[build]
  # The app now lives at the repository root. Previously the site published the
  # "nabl website" folder directly with no build step; that folder is gone.
  #
  # Netlify reads this file from the site's *base directory*, so if that were
  # still pointing at the old "nabl website" folder this file would never be
  # loaded. Verified on 2026-08-16 that it is: the live response carries the
  # Content-Security-Policy and Strict-Transport-Security headers set at the
  # foot of this file, and they have no other source. Base directory is
  # correct — no UI change needed.
  #
  # If those headers ever disappear from the live response, suspect this
  # setting first: Site configuration -> Build & deploy -> Build settings.
  base = ""
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback — every other route is served by the React app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets are immutable; everything else revalidates so a
# redeploy is picked up immediately.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    # HSTS: a year, subdomains included. Only safe because the whole site is
    # HTTPS-only on Netlify — do not add this to a host still serving plain HTTP.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Nothing here needs a camera, a microphone, a location or a payment sheet.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-DNS-Prefetch-Control = "off"
    # Content Security Policy.
    #   script-src stays 'self': Vite bundles everything, so no inline or
    #     third-party script is ever needed. This is the clause that actually
    #     limits XSS, so it is kept strict.
    #   style-src needs 'unsafe-inline' because React writes inline style
    #     attributes. Inline styles cannot execute script, so this is a far
    #     weaker concession than the script one. No third-party style or font
    #     origin is allowed at all — the fonts are self-hosted.
    #   connect-src is limited to Supabase (data + storage) and Web3Forms (the
    #     discovery-call form). Anything else the page tries to reach is blocked.
    #   frame-ancestors 'none' is the CSP equivalent of X-Frame-Options: DENY,
    #     and is the one browsers actually honour now.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://rrkcoqopcqtowbyismcq.supabase.co https://api.web3forms.com; upgrade-insecure-requests"

# The attempt log and anything under /brand are static; never let a proxy or
# browser cache an authenticated view of the app shell.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Fonts are content-hashed by name and effectively immutable.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
