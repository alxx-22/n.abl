<title>Argument Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter+Tight:ital,wght@0,400..700;1,400..600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* ============================================================
     n.abl — the tokens from src/styles/tokens.css, not a new palette.
     Warm espresso base, cream light source, amber accent. The brand is
     deliberately single-world and dark-first, so this commits to it
     rather than inventing a light theme it has never had.
     ============================================================ */
  :root {
    --bg:#0E0C0A; --bg-alt:#13100E;
    --surface-1:#1A1613; --surface-2:#221D18; --surface-3:#2B241E; --surface-4:#362D25;
    --cream-100:#FBF6EC; --cream-200:#F0E7D8; --cream-300:#DED2C0;
    --cream-400:#C8BBA8; --cream-600:#9A8F80; --cream-800:#5A5249;
    --on-accent:#24170A;
    --cream-rgb:240,231,216;
    --accent-200:#F8D9A4; --accent-300:#F2C57E; --accent-400:#E9AC57;
    --accent-500:#D9922F; --accent-600:#B87718; --accent-rgb:233,172,87;
    --danger:#E0796D; --danger-deep:#8E3128; --danger-soft:rgba(224,121,109,.13);
    --success:#9DBE97;
    --line-faint:rgba(var(--cream-rgb),.06);
    --line:rgba(var(--cream-rgb),.11);
    --line-strong:rgba(var(--cream-rgb),.20);
    --glow-sm:0 0 24px rgba(var(--cream-rgb),.07);
    --font-display:'Space Grotesk','Inter Tight',system-ui,sans-serif;
    --font-sans:'Inter Tight',system-ui,-apple-system,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',monospace;
    --r-sm:6px; --r-md:10px; --r-lg:16px; --r-full:999px;
    --track-tight:-0.03em; --track-snug:-0.015em; --track-wide:0.14em;
  }

  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--cream-200);
    font-family:var(--font-sans); font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }
  button, input, select { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--accent-400); outline-offset:2px; border-radius:3px; }
  ::selection { background:rgba(var(--accent-rgb),.3); color:var(--cream-100); }

  /* ---------- header ---------- */
  header { border-bottom:1px solid var(--line); background:var(--bg-alt);
           padding-top:env(safe-area-inset-top, 0px); flex:none; }
  .bar { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; padding:13px 22px; }
  .wordmark { font-family:var(--font-display); font-size:19px; font-weight:700;
              letter-spacing:var(--track-tight); color:var(--cream-100); margin:0; }
  .wordmark b { color:var(--accent-400); font-weight:700; }
  .sub { color:var(--cream-600); font-size:12px; letter-spacing:var(--track-wide);
         text-transform:uppercase; }
  .live { margin-left:auto; display:flex; align-items:center; gap:8px;
          font-family:var(--font-mono); font-size:11px; color:var(--cream-600); }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--success); flex:none;
         box-shadow:0 0 10px rgba(157,190,151,.6); }
  .dot.stale { background:var(--accent-400); box-shadow:0 0 10px rgba(var(--accent-rgb),.5); }
  .dot.down { background:var(--danger); box-shadow:0 0 10px rgba(224,121,109,.5); }

  /* ---------- counters ---------- */
  .counts { display:flex; overflow-x:auto; border-top:1px solid var(--line-faint); }
  .count { flex:1 0 auto; min-width:104px; padding:10px 22px;
           border-right:1px solid var(--line-faint); }
  .count:last-child { border-right:0; }
  .count b { display:block; font-family:var(--font-mono); font-size:18px; font-weight:500;
             letter-spacing:var(--track-snug); font-variant-numeric:tabular-nums;
             line-height:1.3; color:var(--cream-100); }
  .count span { display:block; font-size:9.5px; color:var(--cream-600);
                text-transform:uppercase; letter-spacing:var(--track-wide); }
  .count.key b { color:var(--accent-400); }

  /* ---------- filters ---------- */
  .filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center;
             padding:11px 22px; border-top:1px solid var(--line);
             background:var(--surface-1); }
  .seg { display:flex; border:1px solid var(--line-strong); border-radius:var(--r-sm);
         overflow:hidden; }
  .seg button { border:0; background:transparent; padding:5px 11px; cursor:pointer;
                font-size:12.5px; color:var(--cream-400);
                border-right:1px solid var(--line); white-space:nowrap;
                transition:background .18s, color .18s; }
  .seg button:last-child { border-right:0; }
  .seg button:hover { background:var(--surface-3); color:var(--cream-100); }
  .seg button[aria-pressed="true"] { background:var(--accent-400); color:var(--on-accent); font-weight:500; }
  select, input[type="search"] {
    font-size:12.5px; padding:5px 9px; border-radius:var(--r-sm);
    border:1px solid var(--line-strong); background:var(--surface-2); color:var(--cream-200);
  }
  select option { background:var(--surface-2); color:var(--cream-200); }
  input[type="search"] { min-width:170px; flex:1 1 170px; max-width:270px; }
  input[type="search"]::placeholder { color:var(--cream-800); }
  .clear { border:1px solid var(--line-strong); background:transparent; cursor:pointer;
           border-radius:var(--r-sm); padding:5px 10px; font-size:12.5px; color:var(--cream-600); }
  .clear:hover { color:var(--accent-400); border-color:var(--accent-600); }
  .seg button .n { font-family:var(--font-mono); font-size:10.5px; opacity:.7;
                   margin-left:5px; font-variant-numeric:tabular-nums; }

  /* ---------- the run panel ---------- */
  .runbtn { margin-left:auto; border:1px solid var(--line-strong); background:var(--surface-2);
            color:var(--cream-200); border-radius:var(--r-sm); padding:5px 14px;
            font-size:12.5px; cursor:pointer; }
  .runbtn:hover { border-color:var(--accent-600); color:var(--accent-300); }
  .runbtn[aria-expanded="true"] { background:var(--accent-400); color:var(--on-accent);
                                  border-color:var(--accent-400); font-weight:500; }
  .live { margin-left:14px; }

  .runpanel { border-top:1px solid var(--line); background:var(--surface-1);
              padding:18px 22px 20px; display:grid; gap:16px; }
  .runhead { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .runhead h3 { margin:0; font-family:var(--font-display); font-size:15px; font-weight:600;
                color:var(--cream-100); letter-spacing:var(--track-snug); }
  .runhead .reach { font-family:var(--font-mono); font-size:11.5px; color:var(--cream-600); }
  .runhead .reach b { color:var(--accent-400); font-weight:500; }
  .runcols { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:16px; }
  .runcol > u { display:block; text-decoration:none; font-size:9.5px; text-transform:uppercase;
                letter-spacing:var(--track-wide); color:var(--cream-600); margin-bottom:8px; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; max-height:132px; overflow-y:auto; }
  .chip { border:1px solid var(--line); background:var(--surface-2); color:var(--cream-400);
          border-radius:var(--r-full); padding:3px 10px; font-size:11.5px; cursor:pointer;
          font-family:var(--font-mono); }
  .chip:hover { border-color:var(--line-strong); color:var(--cream-200); }
  .chip[aria-pressed="true"] { background:var(--accent-400); color:var(--on-accent);
                               border-color:var(--accent-400); font-weight:500; }
  .chip .n { opacity:.6; margin-left:5px; font-size:10px; }
  .runcol input[type="number"], .runcol input[type="text"] {
    width:100%; font-size:12.5px; padding:5px 9px; border-radius:var(--r-sm);
    border:1px solid var(--line-strong); background:var(--surface-2); color:var(--cream-200); }
  .hint { font-size:11.5px; color:var(--cream-600); margin:7px 0 0; line-height:1.5; }

  .switches { display:grid; gap:11px; border-top:1px solid var(--line-faint); padding-top:15px; }
  .sw { display:flex; gap:11px; align-items:flex-start; }
  .sw input { margin-top:3px; width:16px; height:16px; accent-color:var(--accent-400); flex:none; }
  .sw label { font-size:13.5px; color:var(--cream-200); }
  .sw label span { display:block; font-size:11.5px; color:var(--cream-600); margin-top:3px;
                   max-width:70ch; line-height:1.5; }
  .sw.danger label { color:var(--danger); }
  .runactions { display:flex; gap:9px; align-items:center; flex-wrap:wrap; }
  .said { font-size:12px; color:var(--cream-600); font-family:var(--font-mono); }

  /* The blockers were a paragraph of red standing between the person and
     the switch. They are still every word they were - they have just
     stopped shouting until asked. */
  .warn { position:relative; display:inline-flex; align-items:center; justify-content:center;
          width:21px; height:21px; flex:none; border-radius:var(--r-full);
          border:1px solid var(--danger); background:var(--danger-soft); color:var(--danger);
          font-family:var(--font-display); font-size:13px; font-weight:700; line-height:1;
          cursor:help; padding:0; }
  .warn:hover, .warn:focus-visible { background:var(--danger); color:var(--espresso, #0E0C0A); }
  .warn .pop { display:none; position:absolute; bottom:calc(100% + 9px); right:0;
               width:min(400px, 74vw); text-align:left; cursor:default; z-index:40;
               background:var(--surface-1); border:1px solid var(--danger);
               border-radius:var(--r-md); padding:13px 16px;
               box-shadow:0 10px 30px rgba(0,0,0,.45); }
  .warn:hover .pop, .warn:focus .pop, .warn:focus-within .pop { display:block; }
  .warn .pop u { display:block; text-decoration:none; font-size:9.5px; text-transform:uppercase;
                 letter-spacing:var(--track-wide); color:var(--danger); font-weight:600;
                 margin-bottom:8px; }
  .warn .pop ol { margin:0; padding-left:18px; font-size:13px; color:var(--cream-200);
                  font-family:var(--font-body, inherit); font-weight:400; }
  .warn .pop li { margin-bottom:6px; }
  .warn .pop li span { display:block; color:var(--cream-600); font-size:11.5px; margin-top:2px; }

  /* Start and stop. Saving a target is not starting it. */
  .go { border:1px solid var(--accent-400); background:var(--accent-400); color:var(--on-accent);
        border-radius:var(--r-sm); padding:6px 16px; font-size:12.5px; font-weight:500;
        cursor:pointer; }
  .go:hover { filter:brightness(1.07); }
  .go[disabled] { opacity:.45; cursor:not-allowed; filter:none; }
  .stop { border:1px solid var(--danger); background:transparent; color:var(--danger);
          border-radius:var(--r-sm); padding:6px 16px; font-size:12.5px; cursor:pointer; }
  .stop:hover { background:var(--danger-soft); }
  .runstate { font-family:var(--font-mono); font-size:11.5px; color:var(--cream-600);
              display:inline-flex; align-items:center; gap:6px; }
  .runstate i { width:7px; height:7px; border-radius:var(--r-full); background:var(--cream-600);
                font-style:normal; flex:none; }
  .runstate.on { color:var(--accent-300); }
  .runstate.on i { background:var(--accent-400); box-shadow:0 0 0 3px rgba(233,172,87,.16); }
  .sep { flex:1 1 auto; }

  /* ---------- the send confirmation ---------- */
  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.62); z-index:var(--z-overlay, 60);
           display:flex; align-items:center; justify-content:center; padding:20px; }
  .dialog { background:var(--surface-1); border:1px solid var(--line-strong);
            border-top:3px solid var(--danger); border-radius:var(--r-lg);
            max-width:520px; width:100%; padding:24px; }
  .dialog h3 { margin:0 0 12px; font-family:var(--font-display); font-size:18px;
               color:var(--cream-100); letter-spacing:var(--track-snug); }
  .dialog p { margin:0 0 12px; font-size:14px; color:var(--cream-300); line-height:1.6; }
  .dialog ul { margin:0 0 14px; padding-left:19px; font-size:13.5px; color:var(--cream-300); }
  .dialog li { margin-bottom:5px; }
  .dialog input { width:100%; font-size:13.5px; padding:7px 10px; border-radius:var(--r-sm);
                  border:1px solid var(--line-strong); background:var(--surface-3);
                  color:var(--cream-100); margin-bottom:14px; }
  .dialog .row { display:flex; gap:9px; justify-content:flex-end; }
  .danger-btn { border:1px solid var(--danger); background:var(--danger-deep);
                color:var(--cream-100); border-radius:var(--r-sm); padding:7px 16px;
                font-size:13px; cursor:pointer; }
  .danger-btn[disabled] { opacity:.4; cursor:not-allowed; }

  @media (max-width:860px) { .runcols { grid-template-columns:1fr; } }

  /* ---------- panes ---------- */
  .panes { flex:1 1 auto; display:grid; grid-template-columns:336px 1fr; min-height:0; }
  .list { border-right:1px solid var(--line); overflow-y:auto; background:var(--bg-alt); }
  .detail { overflow-y:auto; padding:24px 28px calc(48px + env(safe-area-inset-bottom, 0px)); }

  .listhead { position:sticky; top:0; background:var(--bg-alt); z-index:2;
              border-bottom:1px solid var(--line); padding:9px 16px;
              font-size:9.5px; text-transform:uppercase; letter-spacing:var(--track-wide);
              color:var(--cream-600); display:flex; gap:8px; align-items:center; }
  .listhead .n { font-family:var(--font-mono); letter-spacing:0; color:var(--cream-300); }
  .sortsel { margin-left:auto; font-size:11px; padding:2px 6px; }

  .row { width:100%; text-align:left; border:0; cursor:pointer; background:transparent;
         border-bottom:1px solid var(--line-faint); padding:11px 16px;
         display:grid; grid-template-columns:8px 1fr; gap:11px; align-items:start;
         transition:background .18s; }
  .row:hover { background:var(--surface-1); }
  .row[aria-current="true"] { background:var(--surface-2);
                              box-shadow:inset 3px 0 0 var(--accent-400); }
  .row[aria-current="true"] .rc { color:var(--accent-200); }
  .pip { width:8px; height:8px; border-radius:50%; margin-top:6px; }
  .pip.drafted { background:var(--success); }
  .pip.no_clause { background:var(--accent-500); }
  .pip.given_up { background:var(--danger); }
  .pip.waiting { background:var(--cream-800); }
  .rc { display:block; font-family:var(--font-display); font-size:13.5px; font-weight:500;
        letter-spacing:var(--track-snug); line-height:1.35; color:var(--cream-100);
        overflow-wrap:anywhere; }
  .rm { display:flex; font-size:11.5px; color:var(--cream-600); margin-top:3px;
        gap:6px; flex-wrap:wrap; align-items:baseline; }
  .rm .sc { font-family:var(--font-mono); font-size:10.5px; color:var(--accent-400);
            font-variant-numeric:tabular-nums; }
  .rm .up { color:var(--success); font-family:var(--font-mono); font-size:10px; }
  .rq { display:-webkit-box; font-size:12.5px; font-style:italic; color:var(--cream-400);
        margin-top:5px; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .empty { padding:28px 18px; color:var(--cream-600); font-size:13.5px; }

  /* ---------- detail ---------- */
  .back { display:none; }
  .dhead { display:flex; gap:11px; align-items:baseline; flex-wrap:wrap;
           padding-bottom:15px; border-bottom:1px solid var(--line); }
  .dco { font-family:var(--font-display); font-size:23px; font-weight:600;
         letter-spacing:var(--track-tight); margin:0; color:var(--cream-100);
         text-wrap:balance; }
  .state { font-family:var(--font-mono); font-size:10px; text-transform:uppercase;
           letter-spacing:.06em; padding:3px 9px; border-radius:var(--r-full); }
  .state.drafted { color:var(--success); background:rgba(157,190,151,.13); }
  .state.no_clause { color:var(--accent-300); background:rgba(var(--accent-rgb),.13); }
  .state.given_up { color:var(--danger); background:var(--danger-soft); }
  .state.waiting { color:var(--cream-600); background:var(--surface-2); }

  .tags { display:flex; gap:5px; flex-wrap:wrap; margin-top:13px; }
  .tag { font-family:var(--font-mono); font-size:10.5px; color:var(--cream-400);
         border:1px solid var(--line); border-radius:4px; padding:2px 7px;
         background:var(--surface-1); }
  .tag a { color:var(--accent-400); text-decoration:none; }
  .tag a:hover { text-decoration:underline; }

  h2 { font-size:10px; text-transform:uppercase; letter-spacing:var(--track-wide);
       color:var(--cream-600); font-weight:600; margin:28px 0 11px;
       display:flex; align-items:center; gap:10px; }
  h2::after { content:''; flex:1; height:1px; background:var(--line-faint); }

  .clause-box { background:var(--surface-1); border:1px solid var(--line);
                border-left:3px solid var(--success); border-radius:var(--r-md); padding:19px; }
  .clause { font-size:21px; line-height:1.45; margin:0; text-wrap:pretty;
            color:var(--cream-100); letter-spacing:var(--track-snug); }
  .evidence { margin-top:15px; font-style:italic; font-size:14px; line-height:1.55;
              color:var(--cream-600); padding-left:13px; border-left:2px solid var(--line-strong); }
  .evidence em { font-style:normal; font-size:9.5px; text-transform:uppercase;
                 letter-spacing:var(--track-wide); color:var(--cream-800);
                 display:block; margin-bottom:5px; }
  .clause-foot { margin-top:15px; display:flex; gap:10px; align-items:center;
                 flex-wrap:wrap; font-family:var(--font-mono); font-size:10px;
                 color:var(--cream-800); }
  .btn { border:1px solid var(--line-strong); background:var(--surface-2); cursor:pointer;
         border-radius:var(--r-sm); padding:5px 12px; font-size:11.5px;
         font-family:var(--font-sans); color:var(--cream-300); }
  .btn:hover { color:var(--accent-300); border-color:var(--accent-600); }
  .btn[aria-pressed="true"] { background:var(--accent-400); color:var(--on-accent);
                              border-color:var(--accent-400); }

  .callout { border-radius:var(--r-md); padding:16px 18px; }
  .callout.warn { background:rgba(var(--accent-rgb),.08); border-left:3px solid var(--accent-500); }
  .callout.bad { background:var(--danger-soft); border-left:3px solid var(--danger); }
  .callout.idle { background:var(--surface-1); border-left:3px solid var(--cream-800); }
  .callout .lbl { font-size:9.5px; text-transform:uppercase; letter-spacing:var(--track-wide);
                  font-weight:600; display:block; margin-bottom:7px; }
  .callout.warn .lbl { color:var(--accent-300); }
  .callout.bad .lbl { color:var(--danger); }
  .callout.idle .lbl { color:var(--cream-600); }
  .callout p { margin:0; font-size:14px; color:var(--cream-300); }
  .callout p.mono { font-family:var(--font-mono); font-size:12.5px; overflow-wrap:anywhere; }

  .summary { font-size:14.5px; color:var(--cream-300); max-width:64ch; margin:0; }

  /* score movement */
  .score { display:flex; gap:18px; flex-wrap:wrap; align-items:flex-end;
           background:var(--surface-1); border:1px solid var(--line);
           border-radius:var(--r-md); padding:16px 19px; }
  .score .big { font-family:var(--font-mono); font-size:30px; font-weight:500;
                color:var(--accent-400); line-height:1; font-variant-numeric:tabular-nums; }
  .score .was { font-family:var(--font-mono); font-size:14px; color:var(--cream-600);
                text-decoration:line-through; }
  .score .lab { font-size:9.5px; text-transform:uppercase; letter-spacing:var(--track-wide);
                color:var(--cream-600); display:block; margin-bottom:5px; }
  .dims { margin-top:14px; display:grid; gap:7px; }
  .dim { display:grid; grid-template-columns:118px 1fr 52px; gap:11px; align-items:center;
         font-size:12px; }
  .dim .nm { color:var(--cream-400); font-family:var(--font-mono); font-size:11px; }
  .dim .track { height:6px; border-radius:var(--r-full); background:var(--surface-3); overflow:hidden; }
  .dim .fill { height:100%; background:var(--accent-500); border-radius:var(--r-full); }
  .dim .fill.zero { background:var(--surface-4); }
  .dim .val { font-family:var(--font-mono); font-size:11px; color:var(--cream-300);
              text-align:right; font-variant-numeric:tabular-nums; }

  /* thread */
  .move { display:grid; grid-template-columns:92px 1fr; gap:15px;
          padding:12px 0; border-top:1px solid var(--line-faint); }
  .move:first-of-type { border-top:0; }
  .who { font-family:var(--font-mono); font-size:11px; padding-top:1px; }
  .who .agent { display:block; font-weight:500; }
  .who .rnd { color:var(--cream-800); font-size:10px; }
  .who[data-agent="scout"] .agent { color:var(--cream-300); }
  .who[data-agent="editor"] .agent { color:var(--accent-300); }
  .who[data-agent="writer"] .agent { color:var(--success); }
  .who[data-agent="strategist"] .agent { color:var(--accent-400); }
  .who[data-agent="letter"] .agent { color:var(--cream-100); }
  .verdict.framed { color:var(--accent-400); }
  .verdict.no_hook { color:var(--danger); }

  .hook { background:var(--surface-1); border:1px solid var(--line);
          border-left:3px solid var(--accent-400); border-radius:var(--r-md);
          padding:16px 19px; display:grid; gap:10px; max-width:68ch; }
