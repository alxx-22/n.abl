<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>n.abl Reception · Demo console</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/console.js"></script>
</head>
<body>
  <div class="top">
    <span class="brand">n.abl <b>Reception</b></span>
    <span class="badge warn">Demo console</span>
    <span class="spacer"></span>
    <span class="muted" id="models"></span>
  </div>
  <main>
    <h1>Demo businesses</h1>
    <div class="status-row" id="status"></div>
    <div class="tenants" id="tenants"><p class="empty">Loading…</p></div>

    <section class="wizard panel" aria-labelledby="wiz-title">
      <h2 id="wiz-title">New demo from a website</h2>
      <p class="muted">Paste a prospect's website. The setup reads its pages and drafts a profile: hours, menu, services and FAQs, taken only from what the site says. Check the notes, edit anything, then publish.</p>
      <form id="ingest-form">
        <label class="hidden" for="ingest-url">Website address</label>
        <input id="ingest-url" type="url" inputmode="url" placeholder="https://www.example-restaurant.co.uk" required>
        <button class="primary" type="submit" id="ingest-go">Read the website</button>
      </form>
      <div id="ingest-result" class="hidden">
        <ul class="notes" id="ingest-notes"></ul>
        <label for="ingest-json" class="muted">Profile (edit before publishing)</label>
        <textarea id="ingest-json" spellcheck="false"></textarea>
        <div><button class="primary" id="publish">Publish demo</button></div>
      </div>
    </section>
  </main>

  <div class="overlay hidden" id="login">
    <form class="panel" id="login-form">
      <h2>Sign in</h2>
      <label for="password">Console password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
