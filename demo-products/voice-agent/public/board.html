<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live board · n.abl Reception</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/board.js"></script>
</head>
<body>
  <div class="accent-bar"></div>
  <div class="top">
    <a href="/" class="brand" aria-label="Back to the console">n.abl <b>Reception</b></a>
    <h1 id="name">…</h1>
    <span class="badge warn">Demo</span>
    <span class="badge info" id="pin"></span>
    <span class="spacer"></span>
    <button class="primary" id="talk" type="button">🎙 Talk to it</button>
    <button id="reset" type="button">Reset demo</button>
  </div>
  <main>
    <div class="board">
      <section class="panel" aria-labelledby="live-title">
        <header><h2 id="live-title">Live call</h2><span class="muted" id="model"></span></header>
        <div class="call-status"><span class="dot" id="dot"></span><span id="call-text">Waiting for a call. Ring the demo number, or press Talk to it.</span></div>
        <div class="stream" id="stream" aria-live="polite"></div>
        <div class="demo-card" id="demo-card">
          <div class="sub">Demo card: no real card will work, and none should be read out</div>
          <div class="num" id="card-num">1234 5678 9012 3456</div>
          <div class="sub" id="card-sub">Expiry 12/34 · Security code 123</div>
        </div>
      </section>

      <section class="panel" aria-labelledby="diary-title" id="diary-panel">
        <header><h2 id="diary-title">Diary</h2><span class="muted" id="diary-count"></span></header>
        <div class="days" id="days" role="group" aria-label="Day"></div>
        <div class="slots" id="slots"></div>
      </section>

      <section class="panel" aria-labelledby="kitchen-title">
        <header><h2 id="kitchen-title">Orders</h2></header>
        <div class="tickets" id="tickets"></div>
        <header class="calls"><h2>Messages &amp; texts</h2></header>
        <div class="messages" id="messages"></div>
      </section>
    </div>

    <section class="panel calls" aria-labelledby="calls-title">
      <header><h2 id="calls-title">Recent calls</h2></header>
      <ul id="calls"></ul>
    </section>
  </main>

  <div class="overlay hidden" id="login">
    <form class="panel" id="login-form">
      <h2>Sign in</h2>
      <label for="password">Console password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
