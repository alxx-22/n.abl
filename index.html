<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E0C0A" />

    <title>n.abl — AI implementation for small and mid-sized businesses</title>
    <!-- The title names the category, because a search result is a list
         somebody is scanning for what a company does. The description leads
         with what the AI does, in the owner's terms, because a result
         snippet is cut around 155 characters. -->
    <meta name="description" content="n.abl builds AI into small and mid-sized UK businesses: phones and messages answered, paperwork read, admin handled. Built around how you work, and looked after every month." />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The og:title carries the promise rather than the category. A shared
         link is a card whose reader already has context from whoever sent it,
         so it can afford to be the headline instead of the descriptor. -->
    <meta property="og:title" content="n.abl — AI, built into your business." />
    <meta property="og:description" content="AI that answers the calls and messages, reads the paperwork and handles the admin, built around one business and looked after every month." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nabl.agency/" />
    <meta property="og:image" content="https://nabl.agency/brand/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Without this the share card shows the bare URL where it could show
         the name. One line, and the name is the thing being recognised. -->
    <meta property="og:site_name" content="n.abl" />
    <!-- The card is an image of the headline, so a reader using a screen
         reader gets nothing from it unless the text is repeated here. -->
    <meta property="og:image:alt" content="n.abl — Tell us what's costing you. We build the fix." />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- ============================================================
         STRUCTURED DATA

         A search engine has no way to tell that "n.abl" is a business in
         Nottingham rather than nabl.org (bond lawyers), nabl-agency.de (a
         Berlin marketing agency) or India's National Accreditation Board,
         all of which outrank us for our own name. This is how the entity
         gets stated rather than inferred.

         It also matters for being quoted. Pages carrying clean entity
         markup are cited by assistants at measurably higher rates, because
         there are facts to lift rather than prose to interpret.

         EVERY CLAIM HERE IS TRUE AND APPEARS ON THE PAGE. Deliberately
         absent, and each one would be a lie today:

           address        — there is no trading address yet. 04-legal and
                            16-finance both carry [PLACEHOLDER]. Add
                            "address" here in the same commit that fills
                            those in, and open the Google Business Profile
                            at the same time.
           telephone      — the site publishes no phone number.
           priceRange     — there is no price list. Retainer prices are
                            set per client on the discovery call.
           aggregateRating / review — there are no clients to review us
                            yet. Inventing these is both against Google's
                            guidelines and a misleading commercial
                            practice under the CPRs.
           sameAs         — no confirmed social profiles.
         ============================================================ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "@id": "https://nabl.agency/#business",
      "name": "n.abl",
      "url": "https://nabl.agency/",
      "email": "hello@nabl.agency",
      "description": "n.abl is an AI implementation business working with small and mid-sized companies in Nottinghamshire and around Alcester in Warwickshire. We build AI around how a business already works, and look after it every month.",
      "areaServed": [
        { "@type": "City", "name": "Nottingham" },
        { "@type": "AdministrativeArea", "name": "Nottinghamshire" },
        { "@type": "City", "name": "Alcester" },
        { "@type": "AdministrativeArea", "name": "Warwickshire" }
      ],
      "knowsAbout": [
        "Applied AI",
        "AI voice agents",
        "AI chat agents",
        "Document processing",
        "Workflow automation",
        "Data and analytics",
        "Web development"
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "What we build",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Voice receptionist", "description": "An AI that answers a business's phone: bookings, changes, questions and messages, passed on straight away." } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Chat and messaging agent", "description": "Answers customers on the website and messaging apps in the business's tone, books them in, and hands over to a person when it should." } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Document AI", "description": "Reads invoices, forms and delivery notes, pulls out what matters and files it, with a person checking anything it is unsure of." } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Back-office agent", "description": "Chases what is overdue, updates records and prepares the numbers, and asks before anything is sent." } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Sales co-pilot", "description": "Listens in on sales calls, transcribes and translates live, and suggests what to say next." } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Knowledge assistant", "description": "Answers a team's questions from the business's own documents, and shows where each answer came from." } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Automation", "description": "Taking repetitive work off people's hands: workflow automation and joining systems that do not talk to each other." } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Data and analytics", "description": "Making the numbers a business already has usable: cleaning the data, dashboards and reporting." } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Web", "description": "Websites, booking flows, customer portals and taking payments." } }
        ]
      }
    }
    </script>

    <!-- Fonts are self-hosted. Loading them from Google would send every
         visitor's IP address to a third party on page load, which is a
         disclosable transfer under UK GDPR and needless when the files are
         214 KB. Preload the two faces used above the fold. -->
    <link rel="preload" href="/fonts/SpaceGrotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/InterTight-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
