<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E0C0A" />

    <title>n.abl — Technology implementation for small business</title>
    <!-- Fixed prices and no retainers lead, because a result snippet is cut
         around 155 characters and that is the strongest thing the business
         can say. The title names the category, because a search result is a
         list somebody is scanning for what a company does. -->
    <meta name="description" content="Fixed prices, no retainers. n.abl is a technology implementation partner for small UK businesses — automation, data and analytics, software, web, AI and training. We start with the problem, not the technology." />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The og:title carries the promise rather than the category. A shared
         link is a card whose reader already has context from whoever sent it,
         so it can afford to be the headline instead of the descriptor. -->
    <meta property="og:title" content="n.abl — We make your business work smarter." />
    <meta property="og:description" content="We listen to what isn't working, understand how your business actually operates, and build the right improvement. Fixed prices, no retainers." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nabl.agency/" />
    <meta property="og:image" content="https://nabl.agency/brand/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts are self-hosted. Loading them from Google would send every
         visitor's IP address to a third party on page load, which is a
         disclosable transfer under UK GDPR and needless when the files are
         214 KB. Preload the two faces used above the fold. -->
    <link rel="preload" href="/fonts/SpaceGrotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/InterTight-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
