<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <!-- The aurora, as the lit ground draws it (components/ground/engine.js, auroraL): a wavy hem of warm light, ember into amber and cream, a haze with faint rays rising from it, dark below. Behind the How we work scenes (home.css, Steps). -->
  <defs>
    <filter id="rays" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.0008" numOctaves="2" seed="11"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.92  0 0 0 0 0.88  0 0 0 0 0.84  1.7 0 0 0 -0.62"/>
      <feGaussianBlur stdDeviation="7 1.5"/>
    </filter>
    <filter id="b18" x="-15%" y="-80%" width="130%" height="260%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="b9" x="-15%" y="-80%" width="130%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="b6" x="-5%" y="-20%" width="110%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <linearGradient id="haze" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E8D2B4" stop-opacity=".5"/>
      <stop offset=".35" stop-color="#B9AEA2" stop-opacity=".26"/>
      <stop offset=".75" stop-color="#8E8A86" stop-opacity=".1"/>
      <stop offset="1" stop-color="#8E8A86" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rise" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".6" stop-color="#fff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="riseM"><rect x="0" y="10" width="600" height="185" fill="url(#rise)"/></mask>
    <linearGradient id="hem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E4532F"/>
      <stop offset=".2" stop-color="#E8834A"/>
      <stop offset=".38" stop-color="#E9AC57"/>
      <stop offset=".6" stop-color="#F2C57E"/>
      <stop offset=".76" stop-color="#EBC9A8"/>
      <stop offset="1" stop-color="#E9AC57"/>
    </linearGradient>
    <linearGradient id="below" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E0C0A" stop-opacity="0"/>
      <stop offset=".22" stop-color="#0E0C0A" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#0E0C0A" stop-opacity=".92"/>
      <stop offset="1" stop-color="#0E0C0A" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7CCBFF" stop-opacity="0"/>
      <stop offset=".55" stop-color="#7CCBFF" stop-opacity=".05"/>
      <stop offset="1" stop-color="#7CCBFF" stop-opacity=".2"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#0E0C0A"/>
  <!-- the haze of light rising from the hem -->
  <rect x="-20" y="10" width="640" height="190" fill="url(#haze)" filter="url(#b9)"/>
  <rect x="-20" y="10" width="640" height="190" fill="url(#ice)" mask="url(#riseM)"/>
  <!-- the curtains' soft rays within it -->
  <g mask="url(#riseM)"><rect x="0" y="10" width="600" height="185" filter="url(#rays)" opacity=".55"/></g>
  <!-- the hem: a broad wave of the warm light, and a brighter core inside it -->
  <path d="M-20 170 C80 150 170 196 280 178 S450 150 620 170 L620 214 C450 196 370 226 280 220 S80 200 -20 214 Z" fill="url(#hem)" filter="url(#b18)" opacity=".95"/>
  <path d="M-20 182 C80 166 170 204 280 188 S450 164 620 182 L620 196 C450 180 370 208 280 202 S80 186 -20 198 Z" fill="url(#hem)" filter="url(#b9)" opacity=".7"/>
  <!-- and the dark closing in below it, softly -->
  <rect x="0" y="196" width="600" height="204" fill="url(#below)"/>
</svg>
